<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Turn a Google Sheet into flashcards. No account, and we keep none of your data."
    />
    <meta name="theme-color" content="#f6f7f5" />

    <!--
      What a link preview shows. Crawlers do not run JavaScript, so unlike the
      document title these cannot follow the reader's language — they are baked
      in once, for everyone.

      The title is written to be read by all three audiences at once: 速記卡 is
      Traditional Chinese, 速記 alone is a Japanese word, and Sokki carries it
      for anyone reading neither. The description gives each language its own
      line, English first because that is the app's default and the language of
      the shell below. Most clients collapse those newlines into one run of
      text, which is why every line ends in its own full stop.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="速記卡 Sokki" />
    <meta property="og:title" content="速記卡 Sokki" />
    <meta
      property="og:description"
      content="Turn a Google Sheet into flashcards.
把一份 Google Sheet 變成速記卡。
Google スプレッドシートをフラッシュカードに。"
    />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <!--
      `summary`, not `summary_large_image`. There is deliberately no image: one
      that is identical for every deck carries nothing, and a large one takes
      the card over and pushes the description — the part that actually says
      something — down or out of view.
    -->
    <meta name="twitter:card" content="summary" />
    <!-- Both spellings: the apple- prefix is deprecated but still what older
         iOS reads when adding to the home screen, which is the only reliable
         way to keep this app's storage from being evicted there. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The canonical link is injected by the `site-origin` plugin, not written
         here: Vite resolves every <link href> through its asset pipeline, and a
         placeholder that is empty at build time resolves to a directory. -->
    <!-- Must stay identical to `app.title` in src/i18n/en.ts: the app rewrites
         document.title on mount, and any difference is a visible flicker in the
         tab for every reader on the default locale. -->
    <title>Sokki — Turn a Google Sheet into flashcards</title>

    <!--
      A data block, not a script: the browser never runs it, so the CSP does not
      govern it and scripts/seal-csp.mjs skips it. Every deck URL carries the
      same canonical above, which is what tells a crawler that `?s=…` is not a
      page of its own — there is an unbounded number of those and none of them
      is ours to publish.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "速記卡 Sokki",
        "url": "%SITE_ORIGIN%/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["en", "zh-Hant", "ja"],
        "description": "Turn a Google Sheet into flashcards. No account, and we keep none of your data.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true
      }
    </script>
    <script>
      /*
       * Deliberately blocking, and deliberately before the stylesheet.
       *
       * A module runs after the first paint, so choosing the theme in the app
       * would show one frame of the wrong one — a flash of white on a dark
       * theme is both ugly and a layout-stability problem. A few milliseconds
       * of blocking buys it away.
       *
       * The key and attribute here must match src/theme/apply.ts.
       */
      (function () {
        try {
          var saved = localStorage.getItem('sokki:settings')
          var theme = saved ? JSON.parse(saved).theme : 'system'
          var colors = {
            light: '#f6f7f5', dark: '#0f1315', sepia: '#f2e9d7', sakura: '#fcd9e8',
            coral: '#ece7e3', steel: '#e7ecf1', terminal: '#080b09', amber: '#f9c294',
            dracula: '#221b33', matcha: '#dfe9c8'
          }
          /*
           * The map is the validity check as well as the colour source. A theme
           * that has since been removed would otherwise be stamped onto <html>
           * with no rules behind it, painting the light palette for one frame
           * before the app resolves it back to "match system" — which is a
           * flash of white on a dark screen, the exact thing this script exists
           * to prevent.
           */
          /*
           * Painting the ground here, not waiting for the stylesheet.
           *
           * `--bg` lives in the external CSS, and until that arrives the page
           * canvas is the browser's default white. That used to be invisible
           * because #app was empty and there was nothing to paint; now that
           * index.html carries the landing page, the browser has a reason to
           * paint before the stylesheet lands, and a dark theme flashes white.
           * Setting it on <html> costs one property and is the only paint that
           * can happen this early.
           */
          var ground = theme && colors[theme]
          if (!ground) {
            ground = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? colors.dark
              : colors.light
          } else {
            document.documentElement.setAttribute('data-theme', theme)
          }
          document.documentElement.style.background = ground
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = ground
          var lang = saved ? JSON.parse(saved).locale : null
          if (lang) document.documentElement.lang = lang
        } catch (e) {
          /* an unreadable preference is not worth a blank page */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
